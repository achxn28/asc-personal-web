<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Translate a lunch order into Yoda speak and pair it with a random GIF."
    />
    <title>Yoda Lunch Order</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Yoda Lunch home">
        Yoda Lunch
      </a>

      <button
        class="menu-button"
        type="button"
        aria-controls="site-nav"
        aria-expanded="false"
      >
        Menu
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
        <a href="index.html" aria-current="page">App</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About Me</a>
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle>
        Change colors
      </button>
    </header>

    <main>
      <section class="page-banner lunch-app" aria-labelledby="lunch-title">
        <div class="section-heading">
          <p class="eyebrow">Week 5 Day 2</p>
          <div>
            <h1 id="lunch-title">Order lunch, Yoda style.</h1>
            <p class="intro">
              Enter a lunch order to translate it with the Yoda API and display
              a random GIF from GIPHY.
            </p>
          </div>
        </div>

        <form class="lunch-form" data-lunch-form>
          <label for="lunch-order">Lunch order</label>
          <div class="lunch-controls">
            <input
              id="lunch-order"
              name="lunch-order"
              type="text"
              autocomplete="off"
              placeholder="Turkey sandwich and lemonade"
              required
            />
            <button
              class="button primary evasive-button"
              type="submit"
              data-submit-order
            >
              Submit
            </button>
          </div>

          <div class="api-results" aria-live="polite">
            <section class="result-panel" aria-labelledby="translation-title">
              <h3 id="translation-title">Translated order</h3>
              <p class="form-message" data-translation-output>
                Enter a lunch order and submit the form.
              </p>
            </section>

            <section class="result-panel gif-panel" aria-labelledby="gif-title">
              <h3 id="gif-title">Random GIF</h3>
              <div class="gif-frame" data-gif-output></div>
              <a
                class="giphy-attribution"
                href="https://giphy.com/"
                target="_blank"
                rel="noreferrer"
              >
                Powered by GIPHY
              </a>
            </section>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>Yoda Lunch</p>
      <p>Lunch order translator. <span data-current-year></span></p>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
